---
galaxy_info:
  role_name: rootpassword
  author: planetmikeorg
  description: Cycle root passwords and store them in 1Password via the onepassword.connect Ansible Collection
  license: MIT
  min_ansible_version: "2.14"

  platforms:
    - name: EL
      versions:
        - "8"
        - "9"
    - name: Ubuntu
      versions:
        - focal
        - jammy
    - name: Debian
      versions:
        - bullseye
        - bookworm

  galaxy_tags:
    - root
    - password
    - security
    - onepassword
    - 1password

dependencies: []

collections:
  - name: onepassword.connect
    version: ">=2.0.0"
